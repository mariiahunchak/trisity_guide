:root{
  --bg:#f5f7fb; --surface:#fff; --surface2:#eef3fb; --text:#172033;

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,Arial,sans-serif}
a{color:inherit;text-decoration:none}

.heroGrid h1{font-size:clamp(40px,5vw,65px);line-height:1.02;letter-spacing:-2px;margin:10px 0 16px}

.heroGrid p{font-size:18px;color:var(--muted);max-width:650px}
.heroGrid img{width:100%;height:360px;object-fit:cover;border-radius:28px;box-shadow:var(--shadow)}

main{padding:0 22px 60px}
section{padding-top:58px}
h2{font-size:34px;line-height:1.1;margin:7px 0 22px;letter-spacing:-1px}
.promo{background:linear-gradient(110deg,#eef5ff,#f6efff);border:1px solid #dce6fb;border-radius:24px;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.promo p,.story{color:var(--muted)}
.planner{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.controls,.planner>.card{padding:24px}

.route-params{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(220px,1fr) minmax(220px,1fr);gap:22px;align-items:end;margin-top:12px}

.time-control{position:relative}
.time-control input{padding-right:44px}
.time-control .time-icon{display:none}
.route-param .field-error{margin-top:7px;color:#c04444;font-size:12px;font-weight:600;line-height:1.35}
.route-params{width:100%;grid-template-columns:minmax(220px,.8fr) minmax(220px,1fr) minmax(220px,1fr);align-items:start;}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two label{display:block;color:#52617a;font-weight:700}
input,select{width:100%;margin-top:7px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8faff;color:var(--text);outline:none}
input:focus,select:focus{border-color:#8baefb;box-shadow:0 0 0 3px #3275f51a}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:#f5f8fd;color:#687894;cursor:pointer}
.chip.on{color:#245ed3;background:#edf4ff;border-color:#a9c5fb}
.wide{width:100%;margin-top:17px}

.head{display:flex;justify-content:space-between;align-items:end;gap:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}

.place a{display:inline-block;padding:9px 11px;background:#eef4ff;border-radius:9px;color:#2865d7;font-size:12px;font-weight:700}
.story{padding:28px;font-size:17px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.story h3{color:var(--text);font-size:27px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.apps .card{padding:22px;font-size:25px}.apps span{display:block;font-size:13px;color:var(--muted);margin-top:5px}
footer{padding:45px 22px 30px;color:#8491a7}
@media(max-width:900px){.heroGrid,.planner{grid-template-columns:1fr}.grid,.apps{grid-template-columns:1fr 1fr}.heroGrid img{height:300px}}

@media(max-width:620px){
  nav{
    height:auto;
    min-height:78px;
    padding:12px 14px;
    gap:10px;
    flex-wrap:wrap;
  }
  nav b{
    font-size:24px;
    letter-spacing:-1px;
    margin-right:auto;
    flex:1 1 auto;
    min-width:0;
  }
  nav a{
    display:block;
    font-size:14px;
    white-space:nowrap;
  }
  .lang-switcher{
    display:flex;
    flex:0 0 auto;
    width:auto;
    max-width:100%;
    overflow-x:auto;
    gap:3px;
    margin-left:0;
    padding:3px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .lang-switcher::-webkit-scrollbar{display:none}
  .lang-btn{
    flex:0 0 auto;
    font-size:11px;
    padding:6px 8px;
    min-width:31px;
  }
  .grid,.apps,.two{grid-template-columns:1fr}
  .route-params{grid-template-columns:1fr;gap:16px}
  .route-param.city-param{grid-column:auto}
  .promo,.head{display:block}
  .promo .btn{margin-top:15px}
  .heroGrid{padding-top:20px}
}

.dashboardStats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 17px}
.stat{padding:18px 20px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.stat b{grid-row:1/3;font-size:24px}.stat strong{font-size:28px;line-height:1}.stat span{font-size:12px;color:var(--muted)}
@media(max-width:700px){.dashboardStats{grid-template-columns:1fr 1fr}}


.lang-switcher{display:flex;gap:5px;margin-left:12px;padding:4px;background:#f0f4fa;border:1px solid #dfe6f1;border-radius:12px}
.lang-btn{border:0;background:transparent;color:#71809a;font-weight:800;font-size:12px;padding:7px 9px;border-radius:8px;cursor:pointer}
.lang-btn.active{background:#fff;color:#2868dc;box-shadow:0 2px 8px rgba(30,55,90,.10)}
.lang-switcher{min-width:0}


.route-meta{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}

.route-note{padding:10px 12px;border-radius:12px;background:#f4f7fb;color:#65748d;font-size:12px;margin:8px 0}
.route-day-title{font-size:18px}
.back-top{margin-top:18px}

    : PLACES_CANONICAL.filter(p=>p.city===city);
  const wanted=ROLE_CATEGORIES[role]||[];

    .map(p=>{
      const val=candidateValidation(p,date,season);if(!val.ok)return null;
      const tr=estimatedTravel(prev||CENTERS[p.city],p,mode);if(!tr)return null;
      const timing=scheduleArrival(p,val.opening,current,tr.minutes, null,end);if(!timing)return null;

function chooseRoleStop(city,date,season,current,end,prev,role,usedIds,usedGroups,mode,foodHistory,allowCrossCity=false){

  if(!options.length&&role==='cafe')options=viableRoleCandidates(city,date,season,current,end,prev,'restaurant',usedIds,usedGroups,mode,foodHistory,allowCrossCity);
  if(!options.length)return null;
  const best=options.slice(0,Math.min(5,options.length));
  const chosen=best[Math.floor(random01(`role|${role}|${current}|${city}|${date}`)*best.length)]||best[0];
  return makeStop(date,chosen.p.city,chosen.p,chosen.tr,chosen.arrival,chosen.departure,prev||null);

function chooseFoodStop(city,date,season,current,end,usedIds,usedGroups,prev=null,preferred='auto',mode=$('transport').value||'walk',foodHistory=new Set()){
  const role=preferred==='cafe'?'cafe':preferred==='restaurant'?'restaurant':'restaurant';
  let options=viableRoleCandidates(city,date,season,current,end,prev,role,usedIds,usedGroups,mode,foodHistory,false);
  if(preferred==='auto'){
    const cafe=viableRoleCandidates(city,date,season,current,end,prev,'cafe',usedIds,usedGroups,mode,foodHistory,false);
    const restaurant=viableRoleCandidates(city,date,season,current,end,prev,'restaurant',usedIds,usedGroups,mode,foodHistory,false);
    options=[...cafe.slice(0,4),...restaurant.slice(0,4)].sort((a,b)=>b.score-a.score);
  }
  if(!options.length)return null;
  const pool=options.slice(0,Math.min(5,options.length));
  const chosen=pool[Math.floor(random01(`food|${city}|${date}|${current}|${preferred}`)*pool.length)]||pool[0];
  return makeStop(date,chosen.p.city,chosen.p,chosen.tr,chosen.arrival,chosen.departure,prev||null);

function markDayFoodHistory(stops,foodHistory){for(const s of stops)if(['restaurant','cafe','breakfast'].includes(s.p.category))foodHistory.add(s.p.id)}
function scenarioOrder(dayIndex){
  const offset=Math.floor(random01(`theme|${routeRandomSeed}|${dayIndex}`)*DAY_SCENARIOS.length);
  return [...DAY_SCENARIOS.slice(offset),...DAY_SCENARIOS.slice(0,offset)];

function chooseScenario(dayIndex,season,mode,usedThemes){
  const ordered=scenarioOrder(dayIndex);
  const eligible=ordered.filter(x=>!usedThemes.has(x.id));
  const seasonal=eligible.filter(x=>{
    if(season==='winter'&&x.id==='activeCoast')return false;
    if(mode==='bike'&&x.id==='cityCulture')return false;
    return true;
  });

function scheduleScenarioDay(city,date,start,end,season,usedIds,usedGroups,dayIndex,usedThemes,globalFoodHistory){
  const mode=$('transport').value||'walk';
  const scenario=chooseScenario(dayIndex,season,mode,usedThemes);usedThemes.add(scenario.id);
  const startMinutes=minutes(start)||600,routeEnd=minutes(end)||1200;
  let current=startMinutes,prev={...CENTERS[city],id:`center:${city}`,city};
  const stops=[],foodHistory=new Set(globalFoodHistory);
  let lastFoodAt=null, lastFoodCategory='';
  const addStop=(s,food=false)=>{
    if(!s)return false;
    stops.push(s);usedIds.add(s.p.id);usedGroups.add(routeRepeatGroup(s.p));
    current=s.departure;prev=s.p;
    if(food){lastFoodAt=current;lastFoodCategory=s.p.category;foodHistory.add(s.p.id);globalFoodHistory.add(s.p.id)}
    return true;
  };

  // Give every day a meaningful opening, but vary whether it is a cafe or restaurant.
  const startRole=scenario.roles[0];
  let s=chooseRoleStop(city,date,season,current,routeEnd,prev,startRole,usedIds,usedGroups,mode,foodHistory);
  if(s)addStop(s,true);

  for(let i=1;i<scenario.roles.length;i++){
    const role=scenario.roles[i];
    // Insert a food pause once the sightseeing window reaches roughly two hours.
    if(lastFoodAt==null)lastFoodAt=startMinutes;
    if(current-lastFoodAt>=105 && !['cafe','restaurant','dinner','startCafe','startRestaurant'].includes(role)){
      const preferred=current-lastFoodAt>=165?'restaurant':'cafe';
      const food=chooseFoodStop(city,date,season,current,routeEnd,usedIds,usedGroups,prev,preferred,mode,foodHistory);
      if(food){addStop(food,true);continue;}
    }
    let stop=chooseRoleStop(city,date,season,current,routeEnd,prev,role,usedIds,usedGroups,mode,foodHistory);
    if(!stop && role==='activity' && selectedInterests.has('karting')){
      stop=chooseRoleStop(city,date,season,current,routeEnd,prev,'activity',usedIds,usedGroups,mode,foodHistory,true);
    }
    if(stop){
      const food=['cafe','restaurant','breakfast'].includes(stop.p.category);
      addStop(stop,food);
    }
  }

  // Ensure the evening has a scenic finish before the final restaurant when time permits.
  const hasView=stops.some(s=>['viewpoints','beaches','water'].includes(s.p.category));
  if(!hasView && current<routeEnd-90){
    const view=chooseRoleStop(city,date,season,Math.max(current,routeEnd-150),routeEnd,prev,'viewpoint',usedIds,usedGroups,mode,foodHistory);
    if(view)addStop(view,false);
  }
  const hasDinner=stops.some(s=>s.p.category==='restaurant'&&s!==stops[0]);
  if(!hasDinner && current<routeEnd-45){
    const dinner=chooseFoodStop(city,date,season,current,routeEnd,usedIds,usedGroups,prev,'restaurant',mode,foodHistory);
    if(dinner)addStop(dinner,true);
  }

  // If Karting is selected, try to place one distinct karting stop in each day.
  if(selectedInterests.has('karting')&&!stops.some(s=>s.p.category==='karting')){
    const kart=chooseRoleStop(city,date,season,current,routeEnd,prev,'activity',usedIds,usedGroups,mode,foodHistory,true);
    if(kart&&kart.p.category==='karting')addStop(kart,false);

  markDayFoodHistory(stops,globalFoodHistory);

function scheduleStandardDay(city,date,start,end,season,usedIds,usedGroups,dayIndex,usedThemes,globalFoodHistory){

function schedulePreset(name,date,start,end,season,usedIds,usedGroups){
  const ids=ROUTE_PRESETS[name],out=[],city=name==='gdansk'?'Gdańsk':'Sopot';
  let current=minutes(start)||360,prev={...CENTERS[city],id:`center:${city}`,city},nextFoodAt=current+120;
  for(const id of ids){
    if(current>=nextFoodAt){
      const food=chooseFoodStop(city,date,season,current,end,usedIds,usedGroups,prev,'auto',$('transport').value||'walk',new Set());
      if(food){out.push(food);usedIds.add(food.p.id);usedGroups.add(routeRepeatGroup(food.p));current=food.departure;prev=food.p;nextFoodAt=current+120;}
    }
    const p=PLACES_CANONICAL.find(x=>x.id===id);
    if(!p||usedIds.has(p.id)||usedGroups.has(routeRepeatGroup(p)))continue;
    const val=candidateValidation(p,date,season);if(!val.ok)continue;
    const tr=prev?estimatedTravel(prev,p,$('transport').value||'walk'):{minutes:0,distanceKm:0,source:'start',geometry:null,exact:true};
    const timing=scheduleArrival(p,val.opening,current,tr.minutes,null,end);if(!timing)continue;
    out.push(makeStop(date,city,p,tr,timing.arrival,timing.departure,prev));usedIds.add(p.id);usedGroups.add(routeRepeatGroup(p));current=timing.departure;prev=p;

function allocateDays(cities,n,date,season,usedIds,usedGroups){
  const counts=Object.fromEntries(cities.map(c=>[c,candidates(c,date,season).length]));
  const usedCity=Object.fromEntries(cities.map(c=>[c,0]));
  const plan=[];
  for(let i=0;i<n;i++){
    let pool=cities;
    if(i<cities.length){
      const unused=cities.filter(c=>usedCity[c]===0);
      if(unused.length)pool=unused;
    }
    const ranked=[...pool].sort((a,b)=>(counts[b]-usedCity[b]*8)-(counts[a]-usedCity[a]*8));
    const top=ranked.slice(0,Math.min(2,ranked.length));
    const c=top[Math.floor(random01(`city|${i}|${date}|${season}`)*top.length)]||ranked[0];
    plan.push(c);usedCity[c]++;
  }
  return plan;
}

function generate(){const token=++generationToken;if(activeRoutingController)activeRoutingController.abort();activeRoutingController=new AbortController();routeRandomSeed=(globalThis.crypto?.getRandomValues?globalThis.crypto.getRandomValues(new Uint32Array(1))[0]:(Date.now()^Math.floor(Math.random()*0xffffffff)))>>>0;const date=$('date').value||todayISO(),start=$('time').value||'10:00',end=$('end-time').value||'20:00',mode=$('transport').value||'walk',preset=$('routePreset').value||'standard',n=Math.max(1,Math.min(14,Number($('days').value)||3));if(!selectedCities.size){$('route').innerHTML=`<div class="route-note">${esc(t('noCity'))}</div>`;setBuildLoading(false);return}if(minutes(end)<=minutes(start)){showTimeValidation();setBuildLoading(false);return}clearTimeValidation();setBuildLoading(true);$('route').innerHTML=`<div class="route-note">${esc(t('route.building'))}</div>`;const season=seasonFor(date,$('season').value);let plan;try{plan=buildRoutePlan(date,start,end,season,mode,preset,n)}catch(error){console.error(error);$('route').innerHTML=`<div class="route-note">${esc(t('route.noRoute'))}</div>`;setBuildLoading(false);return}if(token!==generationToken)return;lastScheduledRoute=plan;lastScheduledRoute.generationToken=token;lastScheduledRoute.geometryLoadedDays=new Set();lastScheduledRoute.geometryLoadingDays=new Set();mapDayIndex=0;renderRouteCards();setBuildLoading(false);void loadRouteGeometry(plan,token,activeRoutingController,0)}

function refreshAll(){renderStatic();renderSocialProfiles();renderBikeResources();refreshControls();renderCatalog();$('placeCount').textContent=String(PLACES_CANONICAL.length);if(lastScheduledRoute){renderRouteCards()}else{setBuildLoading(false)}}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{if(currentLang===b.dataset.lang)return;currentLang=b.dataset.lang;localStorage.setItem('strefaLang',currentLang);refreshAll()}));
window.addEventListener('resize',()=>{if(mapInstance){mapInstance.invalidateSize({pan:false});if(lastScheduledRoute)updateMapDay(mapDayIndex)}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mapInstance){setTimeout(()=>{mapInstance.invalidateSize({pan:false});if(lastScheduledRoute)updateMapDay(mapDayIndex)},80)}});
$('go').addEventListener('click',generate);$('time').addEventListener('input',clearTimeValidation);$('end-time').addEventListener('input',clearTimeValidation);$('cityFilter').addEventListener('change',renderCatalog);$('catFilter').addEventListener('change',renderCatalog);$('backTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
for(const [lang,texts] of Object.entries({uk:{'map.loading':'Завантаження карти…','map.bike':'Велосипедом','map.unavailable':'Карта маршруту тимчасово недоступна.'},ru:{'map.loading':'Загрузка карты…','map.bike':'На велосипеде','map.unavailable':'Карта маршрута временно недоступна.'},en:{'map.loading':'Loading map…','map.bike':'Bicycle','map.unavailable':'Route map is temporarily unavailable.'},pl:{'map.loading':'Ładowanie mapy…','map.bike':'Rowerem','map.unavailable':'Mapa trasy jest tymczasowo niedostępna.'}}))Object.assign(I18N[lang],texts);
const validationErrors=validateDataLayer();if(validationErrors.length)console.warn('DATA validation errors:',validationErrors);
$('date').value=todayISO();refreshAll();
